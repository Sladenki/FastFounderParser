{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <a href="javascript:history.back()" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-indigo-600 mb-6 transition-colors">
        <svg class="mr-2 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Назад к списку
    </a>

    <article class="bg-white rounded-2xl p-8 md:p-12 shadow-sm border border-slate-200">
        <div class="mb-8">
            <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-sm font-semibold rounded-full uppercase tracking-wide mb-4">
                {{ case.category }}
            </span>
            <h1 class="text-3xl md:text-4xl font-bold text-slate-900 leading-tight">
                {{ case.title }}
            </h1>
        </div>

        <div class="prose prose-slate prose-lg max-w-none">
            <p class="whitespace-pre-line text-slate-700 leading-relaxed">
                {{ case.description }}
            </p>
        </div>
    </article>
</div>
{% endblock %}
